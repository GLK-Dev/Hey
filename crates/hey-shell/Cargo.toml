[package]
name = "hey-shell"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
description = "Application shell (winit, MVU runtime) for the Hey UI framework"

[dependencies]
hey-core = { path = "../hey-core", version = "0.1.0" }
hey-draw = { path = "../hey-draw", version = "0.1.0" }
hey-render-cpu = { path = "../hey-render-cpu", version = "0.1.0" }
hey-render-gpu = { path = "../hey-render-gpu", version = "0.1.0" }
hey-text = { path = "../hey-text", version = "0.1.0" }
hey-layout = { path = "../hey-layout", version = "0.1.0" }
hey-style = { path = "../hey-style", version = "0.1.0" }
hey-widgets = { path = "../hey-widgets", version = "0.1.0" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
winit = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
softbuffer = { workspace = true }
arboard = { workspace = true }
rfd = { workspace = true }

[features]
# Prints per-frame span timings (`frame`, `app_draw`, `render`, `ui_paint`) to stderr; filter with `RUST_LOG`.
profiling = ["dep:tracing-subscriber"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { workspace = true, features = ["gtk3"] }
# Without this arboard only talks to X11, which fails on pure Wayland sessions.
arboard = { workspace = true, features = ["wayland-data-control"] }
