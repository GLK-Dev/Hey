[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2021"
license = "MIT"

# Versions of external dependencies are pinned here; crates refer to them via `workspace = true`.
[workspace.dependencies]
arboard = { version = "3", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
png = "0.17"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }
serde_json = "1"
softbuffer = "0.4"
taffy = "0.16"
cosmic-text = "0.19"
unicode-segmentation = "1"
wgpu = "24"
winit = "0.30"
