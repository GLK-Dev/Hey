[package]
name = "counter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal MVU example on Hey: a counter"

[dependencies]
hey-core = { path = "../../crates/hey-core" }
hey-layout = { path = "../../crates/hey-layout" }
hey-style = { path = "../../crates/hey-style" }
hey-widgets = { path = "../../crates/hey-widgets" }
hey-shell = { path = "../../crates/hey-shell", default-features = false }

[features]
# Size benchmark: `cargo build --release -p counter --no-default-features` builds the CPU-only variant.
default = ["gpu"]
gpu = ["hey-shell/gpu"]
